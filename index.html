<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stāsta spēks</title>
<meta name="description" content="Claude kursi: Latviešu un angļu valodā.">
<style>
  :root { --ink: #1D1D1F; --muted: #6E6E73; --claude: #C15F3C; --bg: #FFFFFF; --panel: #F5F5F7; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px 64px; text-align: center; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  .muted { color: var(--muted); margin: 0 0 32px; }
  a.card { display: block; background: var(--panel); border-radius: 20px; padding: 22px 24px; margin: 0 0 14px; text-decoration: none; color: var(--ink); }
  a.card:hover, a.card:focus-visible { outline: 3px solid var(--claude); outline-offset: 2px; }
  a.card b { display: block; font-size: 1.2rem; color: var(--claude); }
  a.card span { color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Stāsta spēks</h1>
  <p class="muted">Izvēlies valodu / Choose your language</p>
  <a class="card" href="/7dienu/"><b>Claude kurss (latviski)</b><span>Teksti, dizaina sistēma un analītika ar Claude</span></a>
  <a class="card" href="/3week/"><b>3-Week Claude Challenge (English)</b><span>8 marketing tasks, join any time</span></a>
</main>
</body>
</html>
